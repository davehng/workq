# workq configuration for the root, two-user install (install.sh): one file per instance.
# Lives at /etc/workq/config.yaml, readable by the workq user only.
# (The no-root install uses etc/config.user.example.yaml instead.)

# The queue repo, reached over SSH with the workq user's deploy key.
repo_url: git@github.com:YOU/workq-queue.git
# Azure DevOps: git@ssh.dev.azure.com:v3/ORG/PROJECT/workq-queue
branch: main

# Where the runner keeps its clones, locks, ledger and problem log.
state_dir: /var/lib/workq

# Base web address of the repo, for links in the digest.
# GitHub:        https://github.com/YOU/workq-queue/tree/main
# Azure DevOps:  https://dev.azure.com/ORG/PROJECT/_git/workq-queue?version=GBmain&path=
web_url: https://github.com/YOU/workq-queue/tree/main

# Leave empty to use the VM's time zone (set it with: timedatectl set-timezone Australia/Perth).
timezone: Australia/Perth

# The overnight shift. The night timer starts it at the start time; it stops by the end time.
window:
  start: "22:00"
  end: "06:00"

max_attempts: 3        # per stage, per round of review
max_output_mb: 20      # largest out/ folder an executor may produce
max_text_mb: 2         # largest plan.md, result.md, check.md or questions.md
allow_web: true        # false removes WebSearch/WebFetch from every stage
bash_allow: []         # e.g. ["python3 *"] lets executors run python3 for data work
limit_wait_min: 30     # wait after a usage limit when the reset time can't be read

claude:
  agent_user: workq-agent                  # run Claude as this user; null runs it as workq
  bin: claude                              # used only when agent_user is null; otherwise
                                           # set CLAUDE_BIN in agent.env if claude isn't on PATH
  wrapper: /opt/workq/bin/agent-claude     # loads the agent's token, then runs Claude
  restricted: true                         # --restricted: file tools stay inside the repo
  extra_args: []

# Models behind each tier. Aliases follow the latest models; full model IDs pin them.
models:
  haiku: haiku
  sonnet: sonnet
  opus: opus

# Limits per run. A plan may ask for less, never more.
stages:
  shape:       {tier: opus,   timeout_min: 15, max_turns: 30, budget_usd: 2.00}
  exec-haiku:  {tier: haiku,  timeout_min: 20, max_turns: 30, budget_usd: 0.50}
  exec-sonnet: {tier: sonnet, timeout_min: 45, max_turns: 60, budget_usd: 3.00}
  exec-opus:   {tier: opus,   timeout_min: 60, max_turns: 80, budget_usd: 8.00}
  check:       {tier: opus,   timeout_min: 20, max_turns: 30, budget_usd: 2.00}

# Nightly caps per tier. Shape and check count against opus.
# On a subscription the dollar figure is Claude Code's estimate, so the run count is the firmer limit.
caps:
  haiku:  {runs: 40, usd: 5}
  sonnet: {runs: 20, usd: 20}
  opus:   {runs: 15, usd: 30}

# Email is optional: set `to: null` and the digest is written to DIGEST.md at the top of
# the queue repo instead. repo_file: auto = that file only when there is no email;
# a file name (or true) = always write it, as well as the email; off = never.
digest:
  to: you@example.com
  # Mail goes only to addresses in these domains. Every address in `to` must match one
  # exactly (sub.example.com does not match example.com), or nothing is sent.
  # Empty = no mail is sent at all.
  allowed_domains: [example.com]
  repo_file: auto
  from: workq@example.com
  subject: workq digest
  route: auto                  # auto, smtp, command, or graph (see the graph section)
  # Route 1: any command that reads a full message on stdin.
  send_command: msmtp -t
  # Route 2, built in: set smtp.host and the command above is not used. Needs no mail
  # program installed (msmtp is not in the RHEL repos).
  smtp:
    host: null                 # e.g. smtp.example.com
    port: 587
    starttls: true             # false for a plain internal relay on port 25
    ssl: false                 # true for port 465
    user: null                 # leave null for a relay that needs no sign-in
    password_file: null        # a file only the workq user can read, holding the password

git:
  author_name: workq
  author_email: workq@example.com

# ---------------------------------------------------------------- Microsoft Graph (work only)
# Sign-in for the Planner link and for sending the digest through Graph. Leave tenant and
# client_id empty and nothing below is used. See "Planner and Microsoft Graph" in README.md.
graph:
  tenant: null                  # e.g. perenti.onmicrosoft.com, or the tenant ID
  client_id: null               # the app registration's Application (client) ID
  token_file: null              # default: <state_dir>/graph/token.json, private to the runner
  # Only if the company proxy inspects TLS with a certificate not in the system store:
  ca_file: null                 # e.g. /etc/pki/tls/certs/company-proxy.pem

planner:
  enabled: false
  # The only plans workq may touch. The plan ID is in the plan's address in Planner.
  plans:
    - id: PLAN-ID
      name: Finance systems     # for the digest and messages only
      # buckets: the six names, if you want others than these defaults
      #   intake: For workq
      #   planning: "workq: planning"
      #   working: "workq: working"
      #   review: "workq: for review"
      #   blocked: "workq: blocked"
      #   done: "workq: done"
  # A task is taken only if it is in the intake bucket, assigned to the signed-in
  # service account, and created by one of these people. Entra object IDs, not
  # addresses: find yours at myaccount.microsoft.com (Overview, "Object ID").
  accept_from: []
  # Mentioned in the review and blocked comments. An object ID; must be in the plan.
  mention: null
  comments:
    enabled: true
    quiet: false                # true = no comment for the executing and checking steps
    summaries: false            # true = also post first lines of results and checks, and the questions
  # How links into the queue repo are made. workq fills in {path}, {commit} and {branch}.
  links:
    file: "https://dev.azure.com/ORG/PROJECT/_git/workq-queue?path=/{path}&version=GC{commit}"
    folder: "https://dev.azure.com/ORG/PROJECT/_git/workq-queue?path=/{path}&version=GC{commit}"
    current: "https://dev.azure.com/ORG/PROJECT/_git/workq-queue?path=/{path}&version=GB{branch}"
  task_link: "https://tasks.office.com/{tenant}/Home/Task/{task}"   # the digest's link to a task
  attachments:
    enabled: true               # needs Files.SelectedOperations.Selected and a library grant
    max_file_mb: 20
    max_item_mb: 50
    keep_days: 30               # after archiving, then the copies are deleted
